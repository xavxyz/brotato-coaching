[project]
name = "brotato-coaching"
version = "0.1.0"
description = "Tooling for a Brotato coaching workspace: reads the game's own save and data files."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
brotato-coaching = "brotato_coaching.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brotato_coaching"]

[dependency-groups]
dev = [
    "pytest>=8",
    "tach~=0.35.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
